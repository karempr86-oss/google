<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="login-page">

    <!-- السهم العلوي -->
    <button class="back-button" aria-label="رجوع">←</button>

    <!-- شعار Google تجريبي -->
    <div class="google-logo" aria-label="شعار تجريبي">
      <span class="g-blue">G</span>
    </div>

    <h1>تسجيل الدخول</h1>

    <p class="description">
      يرجى استخدام حسابك على Google. سيتم إضافة الحساب إلى هذا الجهاز وسيكون متاحًا لاستخدامه في تطبيقات Google الأخرى.
    </p>

    <a href="#" class="more-info">مزيد من المعلومات حول استخدام حسابك</a>

    <form id="bookingForm">

      <div class="input-box" >
        <input 
          type="email"
          id="email"
          placeholder="البريد الإلكتروني أو الهاتف"
          
      
        >
      </div>

      <a href="#" class="forgot">هل نسيت بريدك الإلكتروني؟</a>

      <p class="notice">
        هذا نموذج تجريبي للتعلّم. لا تدخل بيانات حسابك الحقيقية.
      </p>

      <div class="actions">
        <button type="button" class="create-account">
          إنشاء حساب
        </button>
      </div>

    <button class="next-button" type="submit">
        التالي
      </button>

    </form>

  </main>

  <script src="script.js"></script>
</body>
</html>
